8:[["Introduction to Chemistry and Materials",-1,"Chemistry is the study of matter: what it is made of and how it changes.","Materials can be natural (wood, cotton) or man-made (plastic, steel). We choose materials by their properties: hardness, lustre, density, solubility and conductivity.","Density = mass ÷ volume","Steel for bridges, plastic for bottles, glass for windows.","What does chemistry mainly study?","Matter and its changes","Only stars and planets","Only living things"],

["Elements, Compounds and Mixtures",1,"An element has one kind of atom. A compound has different atoms chemically joined. A mixture is physically mixed.","Compounds have fixed composition and new properties (H₂O). Mixtures can be separated by physical methods and keep the properties of their parts.","Water = H₂O (2 H : 1 O atoms)","Air is a mixture; table salt is a compound.","Water (H₂O) is a...","compound","element","mixture"],

["Physical and Chemical Changes",2,"In a physical change no new substance forms. In a chemical change a new substance forms.","Chemical changes show signs such as gas, colour change, a precipitate, heat or light. Rusting and burning are chemical changes; melting is physical.","Iron + oxygen + water → rust","Cooking food, rusting of iron, digestion.","Which is a chemical change?","Rusting of iron","Melting of ice","Dissolving sugar in water"],

["Metals and Non-Metals",2,"Metals are usually shiny, malleable and conduct electricity. Non-metals are usually dull and brittle.","Metals react with oxygen to form basic oxides; non-metals form acidic oxides. Graphite is a non-metal that conducts electricity. Mercury is a liquid metal.","Metal + oxygen → metal oxide","Copper wires, iron tools, sulfur in matchsticks.","Which non-metal conducts electricity?","Graphite","Sulfur","Phosphorus"],

function ptui(){const z=PTV.z,ps=pos(z),q=PTV.q.trim().toLowerCase(),a=einfo(z),b=PTV.c?einfo(PTV.c):null;
const cells=E.map((e,i)=>{const n=i+1,p=pos(n),m=!q||e[0].toLowerCase()==q||e[1].toLowerCase().includes(q)||String(n)==q,hl=p.p==ps.p||(p.g!=null&&p.g==ps.g);return`<button class="pt${n==z?' sel':''}${hl?' hl':''}" style="grid-row:${p.r};grid-column:${p.c};background:${CATS[ecat(n)][1]}55;opacity:${m?1:.25}" onclick="PTV.z=${n};dash()" aria-label="${e[1]}, atomic number ${n}">${e[0]}</button>`}).join('');
$('dash').innerHTML=`<h2>🧪 Periodic Table Explorer</h2><small>All 118 elements. Search, tap an element, compare two. Outlined cells share the selected element’s period or group.</small><label>Search by name, symbol or number<input id="ptq" type="text" value="${PTV.q.replace(/[<>&"]/g,'')}" style="${inp}" onchange="ptq(this.value)"></label><div class="ptg" role="group" aria-label="Periodic table">${cells}</div><div style="font-size:11px;margin:6px 0">${Object.values(CATS).map(c=>`<span style="color:${c[1]}">■</span> ${c[0]}`).join(' · ')}</div><div class="card"><table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th></th><th align="left">${E[z-1][0]}</th>${b?`<th align="left">${E[PTV.c-1][0]}</th>`:''}</tr>${a.map((r,i)=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td>${b?`<td>${b[i][1]}</td>`:''}</tr>`).join('')}</table></div><label>Compare with<select onchange="PTV.c=+this.value;dash()"><option value="0">— none —</option>${E.map((e,i)=>`<option value="${i+1}" ${PTV.c==i+1?'selected':''}>${i+1} ${e[1]}</option>`).join('')}</select></label><p><button onclick="ptgo(${z})">⚛ Open 3D atom</button> <button onclick="go()">← Lab Home</button></p><small>Configurations follow the Aufbau rule with common exceptions (Cr, Cu, Nb, Mo, Ru, Rh, Pd, Ag, Pt, Au); other f-block exceptions are not listed. Elements with Z ≥ 104 have few measured properties. Atomic masses in brackets are mass numbers of a long-lived isotope. Periodic-trend graphs are not included in this version.</small>`}
/* ---- extra calculators ---- */
const NA=6.02214076e23,RG=8.314462618,
MC={part:{n:'Number of particles (N = n × Nₐ)',L:['Moles n (mol)'],d:[1],fn:([n])=>[`n = ${n} mol`,'N = n × Nₐ, with Nₐ = 6.022 × 10²³ mol⁻¹',`N = ${n} × 6.022 × 10²³`,`<b>N = ${(n*NA).toExponential(3)} particles</b>`,'One mole always contains Avogadro’s number of particles.']},
dil:{n:'Dilution (M₁V₁ = M₂V₂)',L:['Initial molarity M₁ (mol/L)','Initial volume V₁ (mL)','Final volume V₂ (mL)'],d:[1,10,100],fn:([a,b,c])=>{if(c<b)throw'Final volume V₂ must be at least V₁';return[`M₁ = ${a} mol/L, V₁ = ${b} mL, V₂ = ${c} mL`,'M₁V₁ = M₂V₂ → M₂ = M₁V₁ ÷ V₂',`M₂ = ${a} × ${b} ÷ ${c}`,`<b>M₂ = ${f(a*b/c)} mol/L</b> (water added: ${f(c-b)} mL)`,'Adding solvent does not change the moles of solute, only the volume.']}},
gas:{n:'Ideal gas: pressure P = nRT ÷ V',L:['Moles n (mol)','Temperature T (K)','Volume V (L)'],d:[1,273.15,22.4],fn:([n,T,V])=>[`n = ${n} mol, T = ${T} K, V = ${V} L`,'PV = nRT, R = 8.314 L·kPa/(mol·K)',`P = ${n} × 8.314 × ${T} ÷ ${V}`,`<b>P = ${f(n*RG*T/V)} kPa</b> (${f(n*RG*T/V/101.325)} atm)`,'Valid for an ideal gas; real gases deviate at high pressure or low temperature.']},
yld:{n:'Percentage yield',L:['Actual yield (g)','Theoretical yield (g)'],d:[8,10],fn:([a,t])=>{if(a>t)throw'Actual yield cannot be above the theoretical yield (check your values)';return[`Actual = ${a} g, theoretical = ${t} g`,'% yield = (actual ÷ theoretical) × 100',`% yield = ${a} ÷ ${t} × 100`,`<b>${f(a/t*100)} %</b>`,'Real reactions lose some product, so the yield is below 100%.']}}};
const mcF=k=>MC[k].L.map((l,i)=>`<label>${l}<input type="number" step="any" id="mi${i}" value="${MC[k].d[i]}"></label>`).join('');
const mcUI=()=>`<div class="card"><b>More calculators</b><label>Calculator<select id="mk" style="width:100%" onchange="$('mf').innerHTML=mcF(this.value)">${Object.entries(MC).map(([k,x])=>`<option value="${k}">${x.n}</option>`).join('')}</select></label><div id="mf">${mcF('part')}</div><p><button onclick="mcalc()">Calculate step by step</button></p></div>`;
function mcalc(){const k=$('mk').value,x=MC[k],val=x.L.map((_,i)=>+$('mi'+i).value);if(!val.every(n=>isFinite(n)&&n>0))return toast('Enter numbers above 0');let r;try{r=x.fn(val)}catch(e){return toast(typeof e=='string'?e:'Check your input')}
$('so').innerHTML=['Input','Formula','Steps','Answer','In simple words'].map((t,i)=>`<div class="card"><b>${t}</b><br>${r[i]}</div>`).join('')}
/* ---- Lab Home (orbiting topic planets) ---- */
const STARS=Array.from({length:90},()=>{const a=R.random()*6.28,b=R.acos(2*R.random()-1),r=9+R.random()*5;return[r*R.sin(b)*R.cos(a),r*R.cos(b),r*R.sin(b)*R.sin(a)]}),PH=[30,200,50,120,280];
const GAL={d(){const t=performance.now()/1000,s=sc();STARS.forEach(q=>{const p=P(q);X.fillStyle='#fff7';X.fillRect(p[0],p[1],1.6,1.6)});
for(let i=0;i<5;i++)PL(Array.from({length:65},(_,j)=>[(2+i*.8)*R.cos(j*PI/32),0,(2+i*.8)*R.sin(j*PI/32)]),'#7dd3fc26',1);
D([0,0,0],s*.7,'#ffb347');TX([-.8,.9,0],'MATHVERSE','#ffd9a0',13);
gp=M.map((_,i)=>{const a=t*(.3-i*.03)+i*1.26,r=2+i*.8;return[r*R.cos(a),0,r*R.sin(a)]});
gp.map((p,i)=>({i,p})).sort((a,b)=>P(a.p)[2]-P(b.p)[2]).forEach(o=>{const r=s*(o.i==gk?.5:.4),q=P(o.p);D(o.p,r,`hsl(${PH[o.i]},80%,55%)`);X.fillStyle='#fff';X.font='12px sans-serif';X.fillText(M[o.i].n.slice(2)+(PG.ex[o.i]?' ✅':''),q[0]+r+3,q[1]+4)})},
pick(x,y){gk=-1;let b=sc()*.55;gp.forEach((p,i)=>{const q=P(p),d=R.hypot(q[0]-x,q[1]-y);if(d<b){b=d;gk=i}});return gk>=0}};
const TP={9:[0,1,4],10:[2,3,1],'1PU':[0,2,3],'2PU':[2,3,4]};
const chips=()=>{$('chips').innerHTML='Class topics: '+TP[$('cls').value].map(i=>`<button onclick="load(${i})">${M[i].n.slice(2)}</button>`).join('');if(view=='g')dash()};$('cls').onchange=chips;
function dash(){if(PTV)return ptui();if(KP)return kp();$('dash').innerHTML=`<h2>⚛ Lab Home</h2><small>Tap a planet (or a button above) to enter its virtual lab. Drag to rotate.</small><div class="card"><b>Level ${lvl()}</b> · ${PG.xp} XP<div class="pb"><i style="width:${PG.xp%100}%"></i></div></div><div class="g2"><div class="card">📈 Progress<br><big>${pct()}%</big></div><div class="card">🧪 Experiments<br><big>${Object.keys(PG.ex).length}/5</big></div></div><div class="card"><b>Quiz levels</b><button class="cc" onclick="qopen()">🎯 Open quiz levels</button>${TQ.map((t,i)=>{const b=QS().b[i];return`<div><small>${b>=4?'✅':i>unl(QS())?'🔒':'▶'} L${i+1} ${t.n} · ${b!=null?b+'/5':'—'}</small><div class="pb"><i style="width:${(b||0)*20}%"></i></div></div>`}).join('')}</div><div class="card"><b>Experiments</b><br><small>${M.map((o,i)=>o.n.slice(2)+' '+(PG.ex[i]?'✅':'—')).join(' · ')}</small></div><p><button onclick="if(confirm('Reset all progress?')){PG=fresh();save();hud()}">Reset progress</button></p><small>✅ Works offline: everything is inside this one file. Progress is saved on this device.</small>`}
/* ---- navigation ---- */
const m=()=>view=='g'?GAL:M[cur];
function act(a){M[cur].act(a);$('ctl').innerHTML=M[cur].ui()}
function navr(){$('nav').innerHTML=M.map((o,i)=>`<button onclick="load(${i})" class="${view=='l'&&cur==i?'on':''}">${o.n}</button>`).join('')}
function setV(){const g=view=='g';$('dash').style.display=g?'':'none';$('tabs').style.display=g?'none':'';if(g){$('exp').style.display=$('pq').style.display='none';dash()}navr()}
function go(){KP=null;PTV=null;view='g';setV()}
function tab(t){$('exp').style.display=t=='e'?'':'none';$('pq').style.display=t=='e'?'none':'';[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t=='l')lab();if(t=='s')solver();if(t=='q')qmap();if(t=='t')tutor()}
function load(i){view='l';cur=i;v={...M[i].v};ph=0;last='';$('ctl').innerHTML=M[i].ui();setV();tab('e')}
$('ctl').addEventListener('input',e=>{const t=e.target;if(!t.id)return;const x=t.tagName=='SELECT'?t.value:+t.value;if(x!==x)return;v[t.id]=x;if($('o'+t.id))$('o'+t.id).textContent=t.value;m().ch&&m().ch(t.id)});
let dn=null,mv=0;
C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);dn=[e.offsetX,e.offsetY];mv=0};
C.onpointermove=e=>{if(!dn)return;const dx=e.offsetX-dn[0],dy=e.offsetY-dn[1];mv+=R.abs(dx)+R.abs(dy);cam.y+=dx*.01;cam.p=R.max(-1.2,R.min(1.2,cam.p+dy*.01));dn=[e.offsetX,e.offsetY]};
C.onpointerup=C.onpointercancel=e=>{if(dn&&mv<6&&view=='g'&&e.type=='pointerup'&&GAL.pick(e.offsetX,e.offsetY))load(gk);dn=null};
C.onwheel=e=>{e.preventDefault();cam.z=R.min(3,R.max(.4,cam.z*(e.deltaY<0?1.1:.9)))};
let t0=0;function loop(t){const dt=R.min(.05,(t-t0)/1000)||0;t0=t;X.clearRect(0,0,W,H);m().d(dt);if(view=='l'){const s=m().i();if(s!==last){$('info').innerHTML=s;last=s}}requestAnimationFrame(loop)}
C.setAttribute('role','img');C.setAttribute('aria-label','Interactive 3D chemistry scene');rs();chips();hud();go();requestAnimationFrame(loop);
</script></body></html>
