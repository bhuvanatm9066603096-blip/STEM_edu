<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BioVerse – Virtual Human Biology Lab</title>
<style>
:root{color-scheme:dark;--bg:#070d24;--pn:#0d1738;--ln:#223166;--tx:#dbe7ff;--mu:#8fa3d6;--cy:#22d3ee;--bl:#3b82f6;--pu:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:radial-gradient(1200px 700px at 70% -10%,#16245a 0,var(--bg) 60%);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:var(--tx);background:#12204d;border:1px solid var(--ln);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--cy)}button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}button.on{background:linear-gradient(135deg,var(--bl),var(--pu));border-color:transparent}
#home{height:100%;overflow:auto;padding:28px 20px}#home h1{margin:0;font-size:clamp(34px,6vw,58px);letter-spacing:-1px;background:linear-gradient(90deg,var(--cy),var(--bl),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
#home p{color:var(--mu);max-width:60ch}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px;max-width:1200px}
.card{text-align:left;padding:18px;border-radius:14px;background:var(--pn);border:1px solid var(--ln);display:block;width:100%}
.card h3{margin:0 0 4px;font-size:20px}.card small{color:var(--mu);display:block;min-height:42px}
.bar{height:6px;background:#17265a;border-radius:4px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pu))}
#lab{position:fixed;inset:0;display:grid;grid-template-columns:1fr 370px;padding-top:env(safe-area-inset-top,0px)}
#vp{position:relative;min-width:0;min-height:0}#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#back{position:absolute;left:12px;top:12px}#hud{position:absolute;left:12px;bottom:12px;background:#0d1738cc;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;font-size:13px;max-width:70%}
#tag{position:absolute;left:0;top:0;pointer-events:none;background:#0d1738ee;border:1px solid var(--cy);border-radius:6px;padding:2px 8px;font-size:13px;white-space:nowrap;display:none}
#tag:before{content:"";position:absolute;left:-18px;top:50%;width:18px;border-top:2px solid var(--cy)}
#panel{overflow:auto;background:var(--pn);border-left:1px solid var(--ln);padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#panel h2{margin:0;font-size:22px}#panel h4{margin:16px 0 6px;color:var(--cy);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:6px}#steps{margin:0;padding:0;list-style:none}
#steps li{padding:6px 9px;border-left:3px solid var(--ln);color:var(--mu);font-size:13.5px}#steps li.a{border-color:var(--cy);color:var(--tx);background:#12204d;border-radius:0 8px 8px 0}
#info{background:#0a1331;border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:14px}
#qz{position:fixed;inset:0;background:#030618d9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#qz>div{background:var(--pn);border:1px solid var(--cy);border-radius:14px;padding:20px;max-width:520px;width:100%}
#qz button.o{display:block;width:100%;text-align:left;margin:6px 0}#qz .ok{border-color:#34d399;background:#0f3b30}#qz .no{border-color:#f87171;background:#40161c}
[hidden]{display:none!important}
@media(max-width:800px){#lab{grid-template-columns:1fr;grid-template-rows:1fr 46%}#panel{border-left:0;border-top:1px solid var(--ln)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="home"><h1>BioVerse</h1><p>A virtual human biology laboratory. Pick a system, watch the real process run, click any part to learn what it does, then test yourself with the quiz.</p><div id="cards"></div></div>
<div id="lab" hidden><div id="vp"><canvas id="cv"></canvas><button id="back">‹ Lab menu</button><div id="hud"></div><div id="tag"></div></div><aside id="panel"></aside></div>
<div id="qz" hidden></div>
<script src="/JS/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),V=a=>new T.Vector3(...a),C=p=>new T.CatmullRomCurve3(p.map(V));
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pl=(p,a,b)=>p>a&&p<b?Math.sin((p-a)/(b-a)*Math.PI):0;
const mat=(c,o=1,e=.05)=>new T.MeshStandardMaterial({color:c,transparent:true,opacity:o,roughness:.45,metalness:.05,emissive:c,emissiveIntensity:e,side:T.DoubleSide});
const E=(r,p,s,c,o=1)=>{const m=new T.Mesh(new T.SphereGeometry(r,28,20),mat(c,o));m.position.set(...p);m.scale.set(...s);return m};
const TB=(p,r,c,o=1,n=48)=>new T.Mesh(new T.TubeGeometry(C(p),n,r,10,false),mat(c,o));
const arc=(r,a0,a1,n=14,cx=0,cy=0,z=0)=>Array.from({length:n+1},(_,i)=>{const a=a0+(a1-a0)*i/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r,z]});
let prog={};try{prog=JSON.parse(localStorage.getItem('bv')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('bv',JSON.stringify(prog))}catch(e){}};
const renderer=new T.WebGLRenderer({canvas:$('#cv'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene=new T.Scene(),camera=new T.PerspectiveCamera(45,1,.1,200);scene.background=new T.Color(0x070d24);
scene.add(new T.AmbientLight(0xffffff,.65));const dl=new T.DirectionalLight(0xffffff,.9);dl.position.set(3,5,6);scene.add(dl);
const l2=new T.PointLight(0x22d3ee,.7,40);l2.position.set(-6,3,5);scene.add(l2);const l3=new T.PointLight(0x8b5cf6,.7,40);l3.position.set(6,-3,-4);scene.add(l3);
const sc=document.createElement('canvas');sc.width=sc.height=32;{const x=sc.getContext('2d'),g=x.createRadialGradient(16,16,0,16,16,16);g.addColorStop(0,'#fff');g.addColorStop(.55,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,32,32)}
const SPR=new T.CanvasTexture(sc);
let parts=[],sys,S,key,cur=null,rx=.15,ry=0,dist=12,tgt=new T.Vector3(),sel=null,tagPt=null,lvl=0,lastStep=-1;
function add(g,o,n,s,a,out){g.add(o);if(n)o.traverse(m=>{if(m.isMesh){m.userData={n,s,a,out,o:m.material.opacity,e:m.material.emissiveIntensity};parts.push(m)}});return o}
function Flow(g,segs,n,sp,sz=.16){const cu=segs.map(s=>C(s[0])),L=cu.map(c=>c.getLength()),tot=L.reduce((a,b)=>a+b),cols=segs.map(s=>new T.Color(s[1]));
const P=new Float32Array(n*3),K=new Float32Array(n*3),geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(P,3));geo.setAttribute('color',new T.BufferAttribute(K,3));
const pts=new T.Points(geo,new T.PointsMaterial({size:sz,map:SPR,vertexColors:true,transparent:true,depthWrite:false,alphaTest:.05}));pts.frustumCulled=false;g.add(pts);
const u=Array.from({length:n},(_,i)=>i/n*tot),v=new T.Vector3();
const f={pts,dir:1,sp,upd(dt){for(let i=0;i<n;i++){u[i]=((u[i]+f.dir*f.sp*dt)%tot+tot)%tot;let x=u[i],k=0;while(k<L.length-1&&x>L[k]){x-=L[k];k++}cu[k].getPointAt(cl(x/L[k]),v);P[i*3]=v.x;P[i*3+1]=v.y;P[i*3+2]=v.z;K[i*3]=cols[k].r;K[i*3+1]=cols[k].g;K[i*3+2]=cols[k].b}geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true}};f.upd(0);return f}
const SYS={};
/* ---------- HEART ---------- */
SYS.heart=()=>{const g=new T.Group(),B=0x4f74e8,R=0xd0384a;
const mk=(r,p,s,c,n,a,b)=>{const m=add(g,E(r,p,s,c,.88),n,a,b,1);m.userData.b=s;return m};
const ra=mk(.85,[-1.2,.9,.3],[1,1.1,.9],B,'Right atrium','Collects blue, oxygen-poor blood coming back from the body.','Receives venous return via the SVC and IVC. The SA node here sets the heart rate (~70 beats/min at rest).');
const la=mk(.8,[1.1,1,-.5],[1,1,.9],R,'Left atrium','Collects red, oxygen-rich blood from the lungs.','Receives oxygenated blood from the pulmonary veins at low pressure (~8 mmHg) and passes it through the mitral valve.');
const rv=mk(1,[-.55,-.7,.4],[1,1.5,.9],B,'Right ventricle','Pumps blood to the lungs.','Thin-walled chamber producing ~25 mmHg systolic pressure to drive the low-resistance pulmonary circuit.');
const lv=mk(1.15,[.75,-.7,-.1],[1,1.6,1],R,'Left ventricle','The strongest chamber. It pumps blood around the whole body.','Thick myocardium generates ~120 mmHg in systole; normal ejection fraction is 55–70%.');
add(g,new T.Mesh(new T.BoxGeometry(.14,2.8,1.5),mat(0xe0a4ac,.9)),'Septum','A muscular wall that keeps blue and red blood apart.','The interventricular septum separates the two circuits and carries the bundle of His and Purkinje fibres.',0).position.set(.1,-.7,.1);
const tb=(p,r,c,n,a,b)=>add(g,TB(p,r,c,.9),n,a,b,0);
tb([[.6,.5,0],[.4,2.3,-.1],[1.4,3,-.3],[2.3,2.2,-.4],[2.4,-.5,-.5]],.38,0xe0455a,'Aorta','The biggest artery. It carries oxygen-rich blood to the body.','Ascending aorta, arch and descending aorta; elastic recoil smooths the pulsatile output (Windkessel effect).');
tb([[-.4,.6,.7],[-.1,2,.6],[.8,2.9,.3],[1.8,3.3,.2]],.3,0x5b7cf0,'Pulmonary artery','Carries blue blood from the heart to the lungs.','The only artery carrying deoxygenated blood; it divides into left and right pulmonary arteries.');
const pv=['Pulmonary veins','Carry red blood from the lungs back to the heart.','Four pulmonary veins return oxygenated blood to the left atrium – the only veins carrying oxygen-rich blood.'];
tb([[1.7,1.3,-.6],[2.9,1.6,-.5]],.2,0xe0455a,...pv);tb([[1.6,.8,-.7],[2.9,.4,-.6]],.2,0xe0455a,...pv);
tb([[-1.4,1.6,.2],[-1.5,3.6,.1]],.28,0x5b7cf0,'Superior vena cava','Brings blue blood from the upper body.','Returns deoxygenated blood from the head, neck and arms to the right atrium.');
tb([[-1.2,.2,.2],[-1.3,-2.2,.1]],.3,0x5b7cf0,'Inferior vena cava','Brings blue blood from the lower body.','Returns venous blood from the abdomen and legs to the right atrium.');
const vm=[['Tricuspid valve',-.9,-.1,.4,'A three-flap door between the right atrium and right ventricle.','Right AV valve. Chordae tendineae and papillary muscles stop it prolapsing during systole.'],['Mitral valve',.95,-.05,-.1,'A two-flap door between the left atrium and left ventricle.','Left AV valve (bicuspid); closure produces the first heart sound (S1) with the tricuspid.'],['Pulmonary valve',-.3,.7,.65,'Lets blood leave the right ventricle but not come back.','Semilunar valve; opens when right ventricular pressure exceeds pulmonary artery pressure.'],['Aortic valve',.55,.6,-.05,'Lets blood leave the left ventricle but not come back.','Semilunar valve; its closure gives the second heart sound (S2).']].map(d=>{const m=add(g,new T.Mesh(new T.CylinderGeometry(.4,.4,.07,20),mat(0xffd166,1,.35)),d[0],d[4],d[5],0);m.position.set(d[1],d[2],d[3]);return m});
const fl=Flow(g,[[[[-1.5,3.6,.2],[-1.4,2,.2],[-1.2,1,.3]],B],[[[-1.2,1,.3],[-.9,-.1,.4],[-.7,-1,.5]],B],[[[-.7,-1,.5],[-.4,.6,.7],[-.1,2,.6],[.8,2.9,.3],[1.8,3.3,.2],[3.2,3.4,0]],B],[[[3.2,3.4,0],[3.4,2.2,-.3],[2.9,1.4,-.5],[1.5,1.1,-.5]],0xff4d5e],[[[1.5,1.1,-.5],[.9,-.05,-.1],[.8,-1,-.1]],0xff4d5e],[[[.8,-1,-.1],[.6,.6,0],[.4,2.3,-.1],[1.4,3,-.3],[2.3,2.2,-.4],[2.4,-.5,-.5]],0xff4d5e],[[[2.4,-.5,-.5],[2.5,-3.2,-.5],[-3.2,-3.4,0],[-3.3,.5,.1],[-2.6,3.7,.2],[-1.5,3.6,.2]],B]],90,3,.22);
const q=(m,k)=>m.scale.set(m.userData.b[0]*(1-k),m.userData.b[1]*(1-k),m.userData.b[2]*(1-k));
return{g,dist:11,tgt:[.3,0,0],labels:[['Start Heartbeat','play'],['Stop','pause'],['Slow Motion','slow'],['Reset','reset'],['Explore','rot']],
upd(dt){const p=S.t*1.2%1,a=pl(p,0,.2),v=pl(p,.2,.55);q(ra,.1*a);q(la,.1*a);q(rv,.16*v);q(lv,.16*v);vm[0].scale.x=vm[1].scale.x=v>.05?1:.25;vm[2].scale.x=vm[3].scale.x=v>.05?.25:1;fl.sp=3+3*v;fl.upd(dt)},
step:()=>{const p=S.t*1.2%1;return p<.2?1:p<.375?2:p<.55?4:[0,3,5][Math.floor(S.t*1.2)%3]},
hud:()=>{const p=S.t*1.2%1;return'72 bpm · '+(p<.2?'Atrial systole':p<.55?'Ventricular systole':'Diastole (relaxed)')},
steps:[['Blue blood from the body enters the right atrium through the vena cavae.','Venous return via SVC/IVC; right atrial pressure ≈ 2–6 mmHg.'],['Atria squeeze and the tricuspid and mitral valves open, filling the ventricles.','Atrial systole adds ~20% of ventricular filling ("atrial kick").'],['The right ventricle pumps blue blood through the pulmonary valve to the lungs.','Pulmonary circulation: low pressure, low resistance.'],['Red blood returns by the pulmonary veins to the left atrium.','Oxygen saturation rises to ~98% after gas exchange.'],['The left ventricle contracts and pushes red blood through the aortic valve into the aorta.','Systemic circulation: ~5 L/min cardiac output at ~120/80 mmHg.'],['Body tissues use the oxygen and the blue blood returns. The cycle repeats.','Capillary exchange, then venous return; total circuit time ≈ 1 minute.']],
quiz:[['Which chamber pumps blood to the whole body?',['Left ventricle','Right atrium','Right ventricle','Left atrium'],0,'The left ventricle has the thickest wall because it must push blood around the body.'],['Blood in the pulmonary veins is…',['Oxygen-poor','Oxygen-rich','Full of waste only','Stopped'],1,'Pulmonary veins carry freshly oxygenated blood to the left atrium.'],['What is the job of the heart valves?',['Make blood red','Stop backflow','Filter blood','Store blood'],1,'Valves open one way so blood only moves forward.']]}};
/* ---------- LUNGS ---------- */
SYS.lungs=()=>{const g=new T.Group(),m=new T.Group(),Pk=0xe58f9b;
const rl=add(g,E(1.6,[-1.9,0,0],[1,1.5,.8],Pk,.55),'Right lung','Has three lobes. It takes in air and passes oxygen to the blood.','Three lobes (upper, middle, lower); slightly larger than the left, which has a cardiac notch.',1);rl.userData.b=[1,1.5,.8];
const ll=add(g,E(1.5,[1.9,0,0],[.95,1.5,.8],Pk,.55),'Left lung','Has two lobes, leaving room for the heart.','Two lobes with a cardiac notch accommodating the heart.',1);ll.userData.b=[.95,1.5,.8];
add(g,TB([[0,4.2,0],[0,1.8,0]],.3,0xcfe3ef,.95),'Trachea','The windpipe. Air travels down it from the nose and mouth.','Cartilage C-rings keep the airway open; ciliated epithelium sweeps mucus and particles upward.',0);
const br=new T.Group();[-1,1].forEach(s=>br.add(TB([[0,1.8,0],[s*.9,1.2,0],[s*1.7,.3,0]],.2,0xd6e6f0,.95)));add(g,br,'Bronchi','Two tubes that split the air between the lungs.','Primary bronchi branch into lobar and segmental bronchi (generations 1–4).',0);
const bo=new T.Group();[-1,1].forEach(s=>{for(let i=0;i<7;i++){const e=[s*(1.2+((i*37)%10)/10*1.2),1.3-i*.45,((i*53)%10)/10*.8-.4];bo.add(TB([[s*1.7,.3,0],[(s*1.7+e[0])/2,(.3+e[1])/2+.2,e[2]/2],e],.06,0xf0d9e0,.95,12));for(let k=0;k<3;k++){const a=E(.13,[e[0]+Math.cos(k*2.1)*.15,e[1]+Math.sin(k*2.1)*.15,e[2]],[1,1,1],0xff9db0,.9);bo.add(a)}}});
add(g,bo,'Bronchioles and alveoli','Tiny branches that end in air sacs called alveoli.','Terminal bronchioles lead to ~300–500 million alveoli giving ~70 m² of gas-exchange surface.',0);
const di=add(g,new T.Mesh(new T.SphereGeometry(3.3,32,10,0,Math.PI*2,0,Math.PI/2),mat(0xb5524a,.9)),'Diaphragm','The big muscle under the lungs. It moves down to pull air in.','Contracts and flattens on inhalation, increasing thoracic volume and lowering intrathoracic pressure.',0);di.position.y=-2.3;di.scale.set(1,.5,.5);
const pv=new T.Group();[-1,1].forEach(s=>{pv.add(TB([[s*.4,1.8,.2],[s*1.6,.9,.5],[s*2,-.6,.5]],.09,0x5b7cf0,.95));pv.add(TB([[s*.5,1.7,-.2],[s*1.4,.5,-.5],[s*1.7,-.8,-.5]],.09,0xff4d5e,.95))});add(g,pv,'Pulmonary blood vessels','Blue vessels bring blood to the lungs; red vessels take it back.','Pulmonary arteries carry deoxygenated blood to alveolar capillaries; pulmonary veins return oxygenated blood.',0);
const air=[-1,1].map(s=>Flow(g,[[[[0,4.4,0],[0,1.8,0]],0x9fe8ff],[[[0,1.8,0],[s*.9,1.2,0],[s*1.7,.3,0],[s*2,-.8,.2]],0x9fe8ff]],30,2.2,.16));
add(m,E(1.6,[0,0,0],[1,1,1],0xff9db0,.3),'Alveolus','A tiny air sac. Oxygen passes through its thin wall into the blood.','Type I pneumocytes form a ~0.5 µm air–blood barrier; type II cells make surfactant to reduce surface tension.',0);
add(m,TB(arc(2.3,0,Math.PI,16),.2,0x5b7cf0,.9),'Capillary (oxygen-poor)','Blue blood arrives carrying carbon dioxide.','Pulmonary capillary receiving deoxygenated blood (PO₂ ≈ 40 mmHg).',0);
add(m,TB(arc(2.3,Math.PI,2*Math.PI,16),.2,0xff4d5e,.9),'Capillary (oxygen-rich)','Red blood leaves full of oxygen.','Blood leaves with PO₂ ≈ 100 mmHg, bound mostly to haemoglobin.',0);
const bf=Flow(m,[[arc(2.3,0,Math.PI,16),0x5b7cf0],[arc(2.3,Math.PI,2*Math.PI,16),0xff4d5e]],40,2,.2),gx=[];
const P=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r,0];[.55,.7,.85].forEach(k=>gx.push(Flow(m,[[[P(1.2,k*Math.PI),P(2.3,k*Math.PI)],0x7df9ff]],6,.8,.26)));
[.15,.3,.45].forEach(k=>{const f=Flow(m,[[[P(2.3,k*Math.PI),P(1.2,k*Math.PI)],0xd9c77a]],6,.8,.26);gx.push(f)});
S.b=.2;const stepI=()=>0;
return{g,m,dist:12,tgt:[0,.6,0],mdist:8,mtgt:[0,0,0],magLabel:'Magnify alveoli',labels:[['Start Breathing','play'],['Pause','pause'],['Inhale','in'],['Exhale','out'],['Slow Motion','slow'],['Magnify alveoli','mag'],['Reset','reset']],
upd(dt,rd){const old=S.b;let tg;if(S.mode==='in')tg=1;else if(S.mode==='out')tg=0;else tg=(1-Math.cos(S.t*1.3))/2;
if(S.mode==='auto')S.b=tg;else S.b+=(tg-S.b)*Math.min(1,rd*3);const b=S.b;S.dir=b>old+1e-4?1:b<old-1e-4?-1:S.dir||1;
[rl,ll].forEach(l=>l.scale.set(l.userData.b[0]+.2*b,l.userData.b[1]+.2*b,l.userData.b[2]+.12*b));di.position.y=-2.3-.45*b;di.scale.y=.5-.25*b;
const adt=S.mode==='auto'?dt:rd*S.spd*(S.play?1:.6);air.forEach(f=>{f.dir=S.dir;f.upd(S.mode==='auto'?dt:(Math.abs(b-old)>1e-4?rd:0))});bf.upd(dt);gx.forEach((f,i)=>{f.dir=1;f.upd(dt)})},
step:()=>{const b=S.b;return S.dir>0?Math.min(2,Math.floor(b*3)):b>.66?3:b>.33?4:5},
hud:()=>'Lung volume '+(2.5+S.b*3.5).toFixed(1)+' L · '+(S.dir>0?'Inhaling':'Exhaling'),
steps:[['The diaphragm contracts and moves down. The ribs lift.','Thoracic volume increases; intrapleural pressure falls to about –8 cmH₂O.'],['Lungs expand and air rushes in through the trachea into the bronchi.','Alveolar pressure drops below atmospheric (Boyle’s law) so air flows in.'],['Air reaches the alveoli through the bronchioles.','Tidal volume ≈ 500 mL; anatomical dead space ≈ 150 mL.'],['Oxygen moves from the alveoli into the blood.','Diffusion down a partial-pressure gradient (PO₂ 104 → 40 mmHg), bound to haemoglobin.'],['Carbon dioxide moves from the blood into the alveoli.','PCO₂ gradient 46 → 40 mmHg; CO₂ diffuses ~20× faster than O₂.'],['The diaphragm relaxes, lungs spring back and air is breathed out.','Passive exhalation from elastic recoil and surfactant-regulated alveolar surface tension.']],
quiz:[['Which muscle moves down when you breathe in?',['Biceps','Diaphragm','Heart','Stomach'],1,'The diaphragm contracts and flattens, making space for the lungs to expand.'],['Where does gas exchange happen?',['Trachea','Bronchi','Alveoli','Diaphragm'],2,'Alveoli have extremely thin walls surrounded by capillaries.'],['Carbon dioxide moves…',['From alveoli into blood','From blood into alveoli','Into the trachea only','Nowhere'],1,'CO₂ diffuses from blood (higher pressure) into the alveoli and is exhaled.']]}};
/* ---------- DIGESTION ---------- */
SYS.digest=()=>{const g=new T.Group(),m=new T.Group(),W=[[0,4.3,.6],[0,3.9,.2],[0,3.3,-.2],[0,2.2,-.2],[.4,1.4,0],[.9,.7,0],[.9,.35,.1],[.3,.15,.1],[-.4,-.2,.1]];
for(let i=0;i<14;i++)W.push([Math.sin(i*1.1)*1.1,-.5-i*.15,.1+Math.cos(i*.8)*.2]);

/* ---------- APP ---------- */
const INFO={heart:['Human Heart','Blood circulation'],lungs:['Human Lungs','Respiration and gas exchange'],digest:['Digestive System','Digestion and absorption'],neuron:['Human Neuron','Impulse and synapse'],kidney:['Human Kidney','Filtration and urine formation']};
function home(){$('#cards').innerHTML=Object.keys(INFO).map((k,i)=>{const b=(prog[k]||{}).best||0;return`<button class="card" data-k="${k}" style="border-top:3px solid ${['#22d3ee','#3b82f6','#8b5cf6','#22d3ee','#3b82f6'][i]}"><h3>${INFO[k][0]}</h3><small>${INFO[k][1]}</small><div class="bar"><i style="width:${b/3*100}%"></i></div><small style="min-height:0;margin-top:4px">Quiz best: ${b}/3</small></button>`}).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(c.dataset.k))}
function open(k){key=k;if(cur)scene.remove(cur.g),cur.m&&scene.remove(cur.m);parts=[];sel=null;tagPt=null;$('#tag').style.display='none';
S={t:0,play:true,slow:false,spd:1,rot:false,cut:false,mag:false,st:0,sp:0,mode:'auto',b:.2,dir:1};cur=sys=SYS[k]();scene.add(sys.g);if(sys.m){scene.add(sys.m);sys.m.visible=false}
$('#home').hidden=true;$('#lab').hidden=false;rx=.15;ry=0;view();lastStep=-1;buildPanel();resize()}
function view(){S.mag=S.mag&&!!sys.m;dist=S.mag?sys.mdist:sys.dist;tgt.set(...(S.mag?sys.mtgt:sys.tgt));sys.g.visible=!S.mag;if(sys.m)sys.m.visible=S.mag}
function act(a){const n=sys.dur?sys.dur.length:0;
if(a==='play'){S.play=true;S.mode='auto'}else if(a==='pause')S.play=false;else if(a==='slow')S.slow=!S.slow;else if(a==='rot')S.rot=!S.rot;
else if(a==='reset'){S.t=0;S.st=0;S.sp=0;S.b=.2;S.mode='auto';S.play=true;S.slow=false;S.spd=1;S.rot=false;S.mag=false;rx=.15;ry=0;view()}
else if(a==='mag'){S.mag=!S.mag;view()}else if(a==='in'){S.mode='in';S.play=true}else if(a==='out'){S.mode='out';S.play=true}
else if(a==='next'){S.st=(S.st+1)%n;S.sp=0}else if(a==='fast')S.spd=S.spd>=3?1:S.spd+1;
document.querySelectorAll('[data-a]').forEach(b=>{const x=b.dataset.a;b.classList.toggle('on',(x==='slow'&&S.slow)||(x==='rot'&&S.rot)||(x==='mag'&&S.mag)||(x==='play'&&S.play&&S.mode==='auto')||(x==='in'&&S.mode==='in')||(x==='out'&&S.mode==='out')||(x==='pause'&&!S.play));if(x==='fast')b.textContent='Increase Speed ('+S.spd+'×)'})}
function buildPanel(){const p=$('#panel');p.innerHTML=`<h2>${INFO[key][0]}</h2><div class="row" style="margin:10px 0">${sys.labels.map(l=>`<button data-a="${l[1]}">${l[0]}</button>`).join('')}</div><div class="row"><button id="cut">Transparent cutaway</button><button id="lv">Level: School</button><button id="qb">Take quiz</button></div><h4>Step by step</h4><ul id="steps"></ul><h4>Selected part</h4><div id="info">Click any part of the model to see its name and function.</div>`;
p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));$('#cut').onclick=e=>{S.cut=!S.cut;e.target.classList.toggle('on',S.cut);applyCut()};$('#lv').onclick=e=>{lvl=1-lvl;e.target.textContent='Level: '+(lvl?'Advanced':'School');steps();showInfo()};$('#qb').onclick=quiz;steps();act('play')}
function steps(){$('#steps').innerHTML=sys.steps.map((s,i)=>`<li data-i="${i}">${s[0]}${lvl?'<br><small style="color:var(--cy)">'+s[1]+'</small>':''}</li>`).join('');lastStep=-1}
function applyCut(){parts.forEach(m=>{m.material.opacity=S.cut&&m.userData.out?.1:m.userData.o})}
function showInfo(){if(!sel)return;const u=sel.userData;$('#info').innerHTML=`<b style="color:var(--cy)">${u.n}</b><br>${lvl?u.a:u.s}`;$('#tag').textContent=u.n}
const rc=new T.Raycaster(),vis=o=>{while(o){if(!o.visible)return false;o=o.parent}return true};
function pick(e){const r=$('#cv').getBoundingClientRect();rc.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);
const h=rc.intersectObjects(parts.filter(m=>vis(m)&&!(S.cut&&m.userData.out)),false)[0];if(sel)sel.material.emissiveIntensity=sel.userData.e;if(!h){sel=null;tagPt=null;$('#tag').style.display='none';return}
sel=h.object;sel.material.emissiveIntensity=.7;tagPt=h.point.clone();showInfo();$('#tag').style.display='block'}
function quiz(){const q=sys.quiz;let i=0,sc=0;const box=$('#qz');box.hidden=false;
const draw=()=>{if(i>=q.length){const pr=prog[key]||{best:0};pr.best=Math.max(pr.best||0,sc);prog[key]=pr;save();box.innerHTML=`<div><h2 style="margin-top:0">Score: ${sc}/${q.length}</h2><p>Best: ${pr.best}/${q.length}. ${sc===q.length?'Perfect – you understand this system.':'Review the steps and try again.'}</p><button id="qx">Close</button> <button id="qr">Retry</button></div>`;$('#qx').onclick=()=>{box.hidden=true};$('#qr').onclick=()=>{i=0;sc=0;draw()};return}
const c=q[i];box.innerHTML=`<div><small>Question ${i+1} of ${q.length}</small><h3>${c[0]}</h3>${c[1].map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join('')}<p id="fb"></p></div>`;
box.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;box.querySelectorAll('.o').forEach(x=>x.disabled=true);b.classList.add(j===c[2]?'ok':'no');box.querySelectorAll('.o')[c[2]].classList.add('ok');if(j===c[2])sc++;$('#fb').innerHTML=c[3]+'<br><button id="nx">Next</button>';$('#nx').onclick=()=>{i++;draw()}})};draw()}
$('#back').onclick=()=>{$('#lab').hidden=true;$('#home').hidden=false;sys=null;home()};
/* input */
const cv=$('#cv'),ptr=new Map();let moved=0,pm=1;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pm=e.button===2||e.shiftKey?2:1});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];
if(ptr.size===2){const a=[...ptr.values()],d0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);ptr.set(e.pointerId,[e.clientX,e.clientY]);const b=[...ptr.values()],d1=Math.hypot(b[0][0]-b[1][0],b[0][1]-b[1][1]);if(d1>0)dist=cl(dist*d0/d1,3,32);moved=99;return}
ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
if(pm===2){tgt.x-=Math.cos(ry)*dx*dist*.0015;tgt.z+=Math.sin(ry)*dx*dist*.0015;tgt.y+=dy*dist*.0015}else{ry-=dx*.006;rx=cl(rx+dy*.006,-1.4,1.4)}});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<6&&ptr.size===0)pick(e)});cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();dist=cl(dist*(1+e.deltaY*.001),3,32)},{passive:false});
function resize(){const v=$('#vp'),w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
let last=performance.now();const pv=new T.Vector3();
function loop(now){requestAnimationFrame(loop);const rd=Math.min(.05,(now-last)/1e3);last=now;if(!sys)return;
const dt=S.play?rd*(S.slow?.25:1)*S.spd:0;if(S.play)S.t+=dt;
if(sys.dur&&S.play){S.sp+=dt/sys.dur[S.st];if(S.sp>=1){S.sp=0;S.st=(S.st+1)%sys.dur.length}}
if(S.rot)ry+=rd*.4;sys.upd(dt,rd);
const i=sys.step();if(i!==lastStep){lastStep=i;document.querySelectorAll('#steps li').forEach((li,j)=>li.classList.toggle('a',j===i))}
$('#hud').textContent=sys.hud();
camera.position.set(tgt.x+dist*Math.sin(ry)*Math.cos(rx),tgt.y+dist*Math.sin(rx),tgt.z+dist*Math.cos(ry)*Math.cos(rx));camera.lookAt(tgt);
if(sel&&tagPt){pv.copy(tagPt).project(camera);const t=$('#tag');if(pv.z<1){t.style.display='block';t.style.transform=`translate(${(pv.x+1)/2*cv.clientWidth+22}px,${(1-pv.y)/2*cv.clientHeight-12}px)`}else t.style.display='none'}
renderer.render(scene,camera)}
home();requestAnimationFrame(loop);
</script></body></html>
