CU([0,-.2,0],10,.4,3,200);L(O,[0,4.5,0],'#fff6',1);TX([.1,4.5,0],'normal','#fff',12);
AR(A,O,'#ffd35c',3);AR(O,B,'#6bff8a',3);L(O,[4*s,-4*c,0],'#6bff8a55',1);L(A,[-4*s,-4*c,0],'#fff3',1);
D(A,8,'#ffd35c');D([-4*s,-4*c,0],8,'#ffd35c55');TX([-4*s,-4*c,0],'virtual image','#fff9',12);
PL(Array.from({length:21},(_,k)=>{const q=rad(v.i)*k/20;return[-1.3*R.sin(q),1.3*R.cos(q),0]}),'#ffd35c',2);PL(Array.from({length:21},(_,k)=>{const q=rad(v.i)*k/20;return[1.6*R.sin(q),1.6*R.cos(q),0]}),'#6bff8a',2);
TX([-1.6*s-.5,1.5,0],'i = '+v.i+'°','#ffd35c',14);TX([1.8*s,1.8,0],'r = '+v.i+'°','#6bff8a',14)},
i(){return h('Angle of incidence i',v.i+'°')+h('Angle of reflection r',v.i+'° (r = i)')+h('Between incident and reflected ray','2 × i = '+2*v.i+'°')+h('Between ray and mirror surface',(90-v.i)+'°')+'<p><b>Laws of reflection:</b> (1) angle of incidence = angle of reflection; (2) the incident ray, reflected ray and normal lie in the same plane. Angles are measured from the normal (the dashed line). The faint image behind the mirror is the virtual image.</p>'},
lab:['Verify the laws of reflection of light.','Plane mirror, ray of light, protractor (virtual).','Set i = 20°, 40°, 60° and read r each time.','r = i every time. Image is as far behind the mirror as the object is in front.','A ray hits a mirror at i = 35°. Find the angle between incident and reflected rays.']}];
/* ---- problem solver (structured templates, not free text) ---- */
const SOL=[
{in:[['u','Speed u (m/s)',20],['a','Angle θ (°)',30],['g','g (m/s²)',10]],fn:x=>{const s=R.sin(rad(x.a)),T=2*x.u*s/x.g,Hh=x.u*x.u*s*s/(2*x.g),Rg=x.u*x.u*R.sin(rad(2*x.a))/x.g;return[`u = ${x.u} m/s, θ = ${x.a}°, g = ${x.g} m/s². Find H and R.`,'H = u² sin²θ / 2g &nbsp; R = u² sin2θ / g &nbsp; T = 2u sinθ / g',`H = ${x.u}² × sin²(${x.a}°) / (2 × ${x.g}) ; R = ${x.u}² × sin(${2*x.a}°) / ${x.g}`,`<b>H = ${f(Hh)} m, R = ${f(Rg)} m</b> (T = ${f(T)} s)`,'The ball rises to H, lands R metres away, and spends T seconds in the air.']}},
{in:[['L','Length L (m)',1],['g','g (m/s²)',9.8]],fn:x=>{const T=2*PI*R.sqrt(x.L/x.g);return[`L = ${x.L} m, g = ${x.g} m/s². Find T and f.`,'T = 2π√(L/g), f = 1/T',`T = 2π × √(${x.L} / ${x.g})`,`<b>T = ${f(T)} s, f = ${f(1/T)} Hz</b>`,'One full swing takes T seconds. Valid for small angles only.']}},
{in:[['V','Voltage V (V)',6],['R','Resistance R (Ω)',10]],fn:x=>[`V = ${x.V} V, R = ${x.R} Ω. Find I.`,'I = V / R (Ohm\'s law)',`I = ${x.V} / ${x.R}`,`<b>I = ${f(x.V/x.R)} A</b> (power P = VI = ${f(x.V*x.V/x.R)} W)`,'Current is how fast charge flows. Higher R lets less current through.']},
{in:[['F','Force F (N)',20],['m','Mass m (kg)',5]],fn:x=>[`F = ${x.F} N, m = ${x.m} kg. Find a.`,'F = m a → a = F / m',`a = ${x.F} / ${x.m}`,`<b>a = ${f(x.F/x.m)} m/s²</b>`,'Starting from rest, the speed rises by this many m/s every second.']},
{in:[['i','Angle i (°)',40]],fn:x=>[`i = ${x.i}° (from the normal).`,'r = i; angle between rays = 2i',`r = ${x.i}° ; 2 × ${x.i}°`,`<b>r = ${x.i}°, angle between rays = ${2*x.i}°</b>`,'The mirror turns the ray so it leaves at the same angle it arrived.']}];
/* ---- quiz templates: 2 per topic, 5 questions per quiz ---- */
M[0].Q=[()=>{const u=rd(2,6)*10;return[`A ball is thrown at ${u} m/s at 30° (g = 10 m/s²). Maximum height (m)?`,u*u/80,`H = u² sin²θ / 2g = ${u}² × 0.25 / 20 = ${f(u*u/80)} m.`]},()=>{const u=rd(2,6)*10;return[`At 45° with u = ${u} m/s and g = 10 m/s², the range (m) is?`,u*u/10,`R = u² sin90° / g = ${u*u} / 10 = ${u*u/10} m.`]}];
M[1].Q=[()=>{const l=rd(1,4);return[`Time period (s) of a pendulum with L = ${l} m (g = 9.8 m/s²)?`,2*PI*R.sqrt(l/9.8),`T = 2π√(L/g) = 2π√(${l}/9.8) = ${f(2*PI*R.sqrt(l/9.8))} s.`]},()=>{const t=rd(1,5);return[`A pendulum has T = ${t} s. Its frequency (Hz) is?`,1/t,`f = 1/T = 1/${t} = ${f(1/t)} Hz.`]}];
M[2].Q=[()=>{const r=rd(2,10),V=rd(2,12);return[`A ${V} V battery is joined to a ${r} Ω resistor. Current (A)?`,V/r,`I = V/R = ${V}/${r} = ${f(V/r)} A.`]},()=>{const I=rd(2,4),V=rd(2,6)*I;return[`${V} V drives a current of ${I} A. Resistance (Ω)?`,V/I,`R = V/I = ${V}/${I} = ${V/I} Ω.`]}];
M[3].Q=[()=>{const m=rd(2,10),a=rd(2,6);return[`A force of ${m*a} N acts on ${m} kg. Acceleration (m/s²)?`,a,`a = F/m = ${m*a}/${m} = ${a} m/s².`]},()=>{const m=rd(2,10),a=rd(2,6);return[`A ${m} kg object accelerates at ${a} m/s². Force (N)?`,m*a,`F = ma = ${m} × ${a} = ${m*a} N.`]}];
M[4].Q=[()=>{const i=rd(2,8)*10;return[`A ray hits a plane mirror with i = ${i}°. Angle between incident and reflected rays (°)?`,2*i,`r = i, so the angle between them is 2i = ${2*i}°.`]},()=>{const i=rd(2,8)*10;return[`A ray hits a mirror at i = ${i}° to the normal. Angle between the ray and the mirror surface (°)?`,90-i,`Normal is 90° to the surface, so 90° − ${i}° = ${90-i}°.`]}];
function mk(g){const r=g(),a=f(r[1]),o=new Set([a]);for(const k of[2,.5,1.5,.75,1.25,3,.25])if(o.size<4)o.add(f(a*k));return{q:r[0],a,e:r[2],o:[...o].sort(()=>R.random()-.5)}}
function startQ(){Z={i:cur,n:0,sc:0,ck:0,pk:null,qs:[0,1,0,1,0].map(k=>mk(M[cur].Q[k]))};showQ()}
function showQ(){const q=Z.qs[Z.n],ck=Z.ck;$('pq').innerHTML=`<h3>🎯 ${M[Z.i].n.slice(2)} quiz · ${Z.n+1}/5</h3><div class="card"><big>${q.q}</big></div><div class="opts">${q.o.map((o,j)=>`<button class="opt ${ck?(o==q.a?'ok':j==Z.pk?'no':''):j==Z.pk?'on':''}" ${ck?'disabled':''} onclick="Z.pk=${j};showQ()">${o}</button>`).join('')}</div>`+(ck?`<div class="card" aria-live="polite">${q.o[Z.pk]==q.a?'✅ Correct!':'❌ Incorrect. Answer: <b>'+q.a+'</b>.'}<br>${q.e}</div><button onclick="nxQ()">${Z.n>3?'Finish':'Next ▶'}</button>`:'<button onclick="chkQ()">Check answer</button>')}
function chkQ(){if(Z.pk==null)return toast('Choose an answer first');Z.ck=1;if(Z.qs[Z.n].o[Z.pk]==Z.qs[Z.n].a)Z.sc++;showQ()}
function nxQ(){Z.n++;Z.ck=0;Z.pk=null;if(Z.n<5)return showQ();PG.q[Z.i]=R.max(PG.q[Z.i]||0,Z.sc);gain(Z.sc*10);$('pq').innerHTML=`<h3>Score: ${Z.sc}/5</h3><div class="card">${Z.sc>=3?'🎉 Well done! Quiz passed.':'Keep practising — try the Lab and Solve tabs, then retake.'}<br>Best score saved on this device: <b>${PG.q[Z.i]}/5</b> · +${Z.sc*10} XP</div><button onclick="startQ()">🔁 Retake quiz</button>`}
/* ---- lab sheet & solver tabs ---- */
function lab(){const o=M[cur],l=o.lab;$('pq').innerHTML=`<h3>🧪 ${o.n.slice(2)} experiment</h3>`+['Aim','Materials required','Procedure (use the Explore tab)','Observation, result & explanation','Practice question'].map((t,i)=>`<div class="card"><b>${t}</b><br>${l[i]}</div>`).join('')+`<button onclick="done_()">${PG.ex[cur]?'✅ Experiment completed':'✔ Mark experiment done'}</button>`}
function done_(){if(PG.ex[cur])return toast('Already completed ✅');PG.ex[cur]=1;gain(20);toast('Experiment completed! +20 XP');lab()}
function solver(){const s=SOL[cur];$('pq').innerHTML=`<h3>🧮 Problem solver · ${M[cur].n.slice(2)}</h3><div class="card">${s.in.map(a=>`<label>${a[1]}<input type="number" step="any" id="s_${a[0]}" value="${(sv[cur]||{})[a[0]]??a[2]}"></label>`).join('')}<p><button onclick="solve()">Solve step by step</button></p></div><div id="so"></div>`}
function solve(){const s=SOL[cur],x={};s.in.forEach(a=>x[a[0]]=+$('s_'+a[0]).value);if(Object.values(x).some(n=>!(n>0)))return toast('Enter positive numbers');sv[cur]=x;const r=s.fn(x);$('so').innerHTML=['1. Known values','2. Formula','3. Substitute','4. Answer','5. In simple words'].map((t,i)=>`<div class="card"><b>${t}</b><br>${r[i]}</div>`).join('')+'<button onclick="see()">▶ Show this in the 3D lab</button>'}
function see(){load(cur);Object.assign(v,sv[cur]);v.t=0;v.x=0;v.vel=0;v.run=1;$('ctl').innerHTML=m().ui()}
/* ---- Lab Home (orbiting topic planets) ---- */
const STARS=Array.from({length:90},()=>{const a=R.random()*6.28,b=R.acos(2*R.random()-1),r=9+R.random()*5;return[r*R.sin(b)*R.cos(a),r*R.cos(b),r*R.sin(b)*R.sin(a)]}),PH=[30,200,50,120,280];
const GAL={d(){const t=performance.now()/1000,s=sc();STARS.forEach(q=>{const p=P(q);X.fillStyle='#fff7';X.fillRect(p[0],p[1],1.6,1.6)});
for(let i=0;i<5;i++)PL(Array.from({length:65},(_,j)=>[(2+i*.8)*R.cos(j*PI/32),0,(2+i*.8)*R.sin(j*PI/32)]),'#7dd3fc26',1);
D([0,0,0],s*.7,'#ffb347');TX([-.8,.9,0],'MATHVERSE','#ffd9a0',13);
gp=M.map((_,i)=>{const a=t*(.3-i*.03)+i*1.26,r=2+i*.8;return[r*R.cos(a),0,r*R.sin(a)]});
gp.map((p,i)=>({i,p})).sort((a,b)=>P(a.p)[2]-P(b.p)[2]).forEach(o=>{const r=s*(o.i==gk?.5:.4),q=P(o.p);D(o.p,r,`hsl(${PH[o.i]},80%,55%)`);X.fillStyle='#fff';X.font='12px sans-serif';X.fillText(M[o.i].n.slice(2)+(PG.ex[o.i]?' ✅':''),q[0]+r+3,q[1]+4)})},
pick(x,y){gk=-1;let b=sc()*.55;gp.forEach((p,i)=>{const q=P(p),d=R.hypot(q[0]-x,q[1]-y);if(d<b){b=d;gk=i}});return gk>=0}};
const TP={9:[3,4,2],10:[2,0,3,4],'1PU':[0,1,3],'2PU':[0,1,2]};
const chips=()=>{$('chips').innerHTML='Class topics: '+TP[$('cls').value].map(i=>`<button onclick="load(${i})">${M[i].n.slice(2)}</button>`).join('');if(view=='g')dash()};$('cls').onchange=chips;
function dash(){$('dash').innerHTML=`<h2>⚛ Lab Home</h2><small>Tap a planet (or a button above) to enter its virtual lab. Drag to rotate.</small><div class="card"><b>Level ${lvl()}</b> · ${PG.xp} XP<div class="pb"><i style="width:${PG.xp%100}%"></i></div></div><div class="g2"><div class="card">📈 Progress<br><big>${pct()}%</big></div><div class="card">🧪 Experiments<br><big>${Object.keys(PG.ex).length}/5</big></div></div><div class="card"><b>Topics & quiz scores</b>${M.map((o,i)=>`<div><small>${o.n.slice(2)} · experiment ${PG.ex[i]?'✅':'—'} · quiz ${PG.q[i]!=null?PG.q[i]+'/5':'—'}</small><div class="pb"><i style="width:${(PG.q[i]||0)*20}%"></i></div></div>`).join('')}</div><p><button onclick="if(confirm('Reset all progress?')){PG=fresh();save();hud()}">Reset progress</button></p><small>✅ Works offline: everything is inside this one file. Progress is saved on this device.</small>`}
/* ---- navigation ---- */
const m=()=>view=='g'?GAL:M[cur];
function act(a){M[cur].act(a);$('ctl').innerHTML=M[cur].ui()}
function navr(){$('nav').innerHTML=M.map((o,i)=>`<button onclick="load(${i})" class="${view=='l'&&cur==i?'on':''}">${o.n}</button>`).join('')}
function setV(){const g=view=='g';$('dash').style.display=g?'':'none';$('tabs').style.display=g?'none':'';if(g){$('exp').style.display=$('pq').style.display='none';dash()}navr()}
function go(){view='g';setV()}
function tab(t){$('exp').style.display=t=='e'?'':'none';$('pq').style.display=t=='e'?'none':'';[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t=='l')lab();if(t=='s')solver();if(t=='q')startQ()}
function load(i){view='l';cur=i;v={...M[i].v};ph=0;last='';$('ctl').innerHTML=M[i].ui();setV();tab('e')}
$('ctl').addEventListener('input',e=>{const t=e.target;if(!t.id)return;const x=t.tagName=='SELECT'?t.value:+t.value;if(x!==x)return;v[t.id]=x;if($('o'+t.id))$('o'+t.id).textContent=t.value;m().ch&&m().ch(t.id)});
let dn=null,mv=0;
C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);dn=[e.offsetX,e.offsetY];mv=0};
C.onpointermove=e=>{if(!dn)return;const dx=e.offsetX-dn[0],dy=e.offsetY-dn[1];mv+=R.abs(dx)+R.abs(dy);cam.y+=dx*.01;cam.p=R.max(-1.2,R.min(1.2,cam.p+dy*.01));dn=[e.offsetX,e.offsetY]};
C.onpointerup=C.onpointercancel=e=>{if(dn&&mv<6&&view=='g'&&e.type=='pointerup'&&GAL.pick(e.offsetX,e.offsetY))load(gk);dn=null};
C.onwheel=e=>{e.preventDefault();cam.z=R.min(3,R.max(.4,cam.z*(e.deltaY<0?1.1:.9)))};
let t0=0;function loop(t){const dt=R.min(.05,(t-t0)/1000)||0;t0=t;X.clearRect(0,0,W,H);m().d(dt);if(view=='l'){const s=m().i();if(s!==last){$('info').innerHTML=s;last=s}}requestAnimationFrame(loop)}
C.setAttribute('role','img');C.setAttribute('aria-label','Interactive 3D physics scene');rs();chips();hud();go();requestAnimationFrame(loop);
</script></body></html>
